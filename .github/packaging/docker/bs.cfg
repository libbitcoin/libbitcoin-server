# Libbitcoin Server configuration file
#
# See https://libbitcoin.org/configuration/index.html for all settings,
# common setups, ports and test chain configurations. Run 'bs --settings'
# to display every setting with its description and default.

[database]
path = bitcoin

[log]
path = log

[admin]
bind = 0.0.0.0:8080
connections = 10

[native]
bind = 0.0.0.0:8180
connections = 10
