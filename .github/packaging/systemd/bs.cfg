# Libbitcoin Server configuration file
#
# See https://libbitcoin.org/configuration/index.html for all settings,
# common setups, ports and test chain configurations. Run 'bs --settings'
# to display every setting with its description and default.
#
# This file configures the libbitcoin-server service, which runs as the
# libbitcoin user. Start it with 'systemctl enable --now libbitcoin-server'.

[folders]
root = /var/lib/libbitcoin-server
console = log
events = log

[admin]
bind = 127.0.0.1:8080
connections = 10

[native]
bind = 127.0.0.1:8180
connections = 10
