name: Double Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag of all five repositories (default: this branch)."
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      tag-database:
        type: string
        required: true
      tag-network:
        type: string
        required: true
      tag-node:
        type: string
        required: true
      tag-server:
        type: string
        required: true
      tag-system:
        type: string
        required: true

permissions:
  contents: read

jobs:

  resolve:
    runs-on: ubuntu-24.04

    outputs:
      system: ${{ steps.resolve.outputs.system }}
      database: ${{ steps.resolve.outputs.database }}
      network: ${{ steps.resolve.outputs.network }}
      node: ${{ steps.resolve.outputs.node }}
      server: ${{ steps.resolve.outputs.server }}

    steps:
      - name: Resolve commits
        id: resolve
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          DEFAULT: ${{ inputs.ref || github.ref_name }}
          REF_system: ${{ inputs.tag-system }}
          REF_database: ${{ inputs.tag-database }}
          REF_network: ${{ inputs.tag-network }}
          REF_node: ${{ inputs.tag-node }}
          REF_server: ${{ inputs.tag-server }}
        run: |
          for REPO in system database network node server; do
            NAME="REF_${REPO}"
            REF="${!NAME:-${DEFAULT}}"
            REFS=$(git ls-remote "https://github.com/${OWNER}/libbitcoin-${REPO}" \
              "refs/heads/${REF}" "refs/tags/${REF}" "refs/tags/${REF}^{}")
            SHA=$(echo "${REFS}" | awk '/\^\{\}$/ { print $1 }')
            SHA=${SHA:-$(echo "${REFS}" | awk 'NR == 1 { print $1 }')}
            if [[ -z "${SHA}" ]]; then
              echo "libbitcoin-${REPO} has no branch or tag '${REF}'."
              exit 1
            fi
            echo "libbitcoin-${REPO} ${REF} ${SHA}" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "${REPO}=${SHA}" >> "$GITHUB_OUTPUT"
          done

  sdk:
    needs: resolve

    strategy:
      fail-fast: false

      matrix:
        include:
          - kind: "apple"
            image: "macos-latest"
          - kind: "windows"
            image: "windows-latest"

    runs-on: ${{ matrix.image }}

    steps:
      - name: Checkout build definition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: ".definition"
          ref: ${{ needs.resolve.outputs.server }}
          repository: ${{ github.repository_owner }}/libbitcoin-server
          sparse-checkout: |
            .github/guix

      - name: Package SDK
        shell: bash
        run: |
          bash .definition/.github/guix/package-sdk.sh ${{ matrix.kind }} sdk

      - name: Upload SDK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-${{ matrix.kind }}
          path: sdk
          retention-days: 1
          if-no-files-found: error

  toolchain:
    needs: resolve

    strategy:
      fail-fast: false

      matrix:
        include:
          - runner: "ubuntu-24.04"
            toolchain: { name: "x86_64-linux-gnu", host: "x86_64-linux-gnu" }
          - runner: "ubuntu-24.04-arm"
            toolchain: { name: "x86_64-linux-gnu", host: "x86_64-linux-gnu" }
          - runner: "ubuntu-24.04"
            toolchain: { name: "aarch64-linux-gnu", host: "aarch64-linux-gnu" }
          - runner: "ubuntu-24.04-arm"
            toolchain: { name: "aarch64-linux-gnu", host: "aarch64-linux-gnu" }
          - runner: "ubuntu-24.04"
            toolchain: { name: "darwin", host: "x86_64-apple-darwin" }
          - runner: "ubuntu-24.04"
            toolchain: { name: "windows", host: "x86_64-pc-windows-msvc" }

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360

    steps:
      - name: Checkout build definition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: ".definition"
          ref: ${{ needs.resolve.outputs.server }}
          repository: ${{ github.repository_owner }}/libbitcoin-server
          sparse-checkout: |
            .github/actions
            .github/guix

      - name: Find toolchain
        id: find
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: guix-cache
          key: guix-${{ runner.arch }}-${{ matrix.toolchain.name }}-${{ hashFiles('.definition/.github/guix/*.scm', '.definition/.github/guix/patches/*') }}
          lookup-only: true

      - name: Setup Guix
        if: ${{ steps.find.outputs.cache-hit != 'true' }}
        uses: ./.definition/.github/actions/setup-guix

      - name: Build toolchain
        if: ${{ steps.find.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          HOST: ${{ matrix.toolchain.host }}
        run: |
          GUIX_DIR="$(realpath .definition/.github/guix)"
          ENVIRONMENT=$(guix time-machine --channels="${GUIX_DIR}/channels.scm" -- \
            shell --no-grafts --load-path="${GUIX_DIR}" --manifest="${GUIX_DIR}/manifest.scm" -- \
            printenv GUIX_ENVIRONMENT)
          INFERIOR=$(find "/var/guix/profiles/per-user/${USER}/inferiors" -type l | head -1)
          mkdir guix-cache
          basename "${INFERIOR}" > guix-cache/inferior-key
          readlink -f "${INFERIOR}" > guix-cache/inferior
          sudo guix archive --generate-key
          cp /etc/guix/signing-key.pub guix-cache/
          guix archive --export -r "$(cat guix-cache/inferior)" "${ENVIRONMENT}" |
            zstd -T0 -12 -o guix-cache/store.nar.zst
          ls -la guix-cache

      - name: Display build logs
        if: ${{ failure() }}
        shell: bash
        run: |
          sudo find /var/log/guix/drvs -type f -mmin -60 -printf '%T@ %p\n' |
            sort -rn | head -5 | while read -r _ LOG; do
              echo "== ${LOG}"
              zcat -f "${LOG}" | tail -60
            done

      - name: Save toolchain
        if: ${{ steps.find.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: guix-cache
          key: ${{ steps.find.outputs.cache-primary-key }}

  guix:
    needs: [ resolve, toolchain, sdk ]

    strategy:
      fail-fast: false

      matrix:
        builder: [ "a", "b" ]

        target:
          - basename: "bs-linux-x64"
            host: "x86_64-linux-gnu"
            toolchain: "x86_64-linux-gnu"
            images: { a: "ubuntu-24.04", b: "ubuntu-24.04-arm" }
            options: "-Denable-avx2=ON -Denable-sse41=ON"
            linkflags: "-static-libstdc++ -static-libgcc"
            flags: "-march=x86-64-v3 -mtune=generic"

          - basename: "bs-linux-x64-shani"
            host: "x86_64-linux-gnu"
            toolchain: "x86_64-linux-gnu"
            images: { a: "ubuntu-24.04", b: "ubuntu-24.04-arm" }
            options: "-Denable-shani=ON -Denable-avx2=ON -Denable-sse41=ON"
            linkflags: "-static-libstdc++ -static-libgcc"
            flags: "-march=x86-64-v3 -mtune=generic"

          - basename: "bs-linux-x64-avxifma"
            host: "x86_64-linux-gnu"
            toolchain: "x86_64-linux-gnu"
            images: { a: "ubuntu-24.04", b: "ubuntu-24.04-arm" }
            options: "-Denable-avxifma=ON -Denable-shani=ON -Denable-avx2=ON -Denable-sse41=ON"
            linkflags: "-static-libstdc++ -static-libgcc"
            flags: "-march=x86-64-v3 -mtune=generic"

          - basename: "bs-linux-x64-avx512ifma"
            host: "x86_64-linux-gnu"
            toolchain: "x86_64-linux-gnu"
            images: { a: "ubuntu-24.04", b: "ubuntu-24.04-arm" }
            options: "-Denable-avx512ifma=ON -Denable-shani=ON -Denable-avx2=ON -Denable-sse41=ON"
            linkflags: "-static-libstdc++ -static-libgcc"
            flags: "-march=x86-64-v3 -mtune=generic"

          - basename: "bs-linux-arm64"
            host: "aarch64-linux-gnu"
            toolchain: "aarch64-linux-gnu"
            images: { a: "ubuntu-24.04", b: "ubuntu-24.04-arm" }
            linkflags: "-static-libstdc++ -static-libgcc"
            flags: "-march=armv8-a -mtune=generic"

          - basename: "bs-linux-arm64-sha2"
            host: "aarch64-linux-gnu"
            toolchain: "aarch64-linux-gnu"
            images: { a: "ubuntu-24.04", b: "ubuntu-24.04-arm" }
            options: "-Denable-sha2=ON -Denable-aes=ON"
            linkflags: "-static-libstdc++ -static-libgcc"
            flags: "-mtune=generic"

          - basename: "bs-linux-arm64-sha3"
            host: "aarch64-linux-gnu"
            toolchain: "aarch64-linux-gnu"
            images: { a: "ubuntu-24.04", b: "ubuntu-24.04-arm" }
            options: "-Denable-sha2=ON -Denable-sha3=ON -Denable-aes=ON"
            linkflags: "-static-libstdc++ -static-libgcc"
            flags: "-mtune=generic"

          - basename: "bs-macos-x64"
            host: "x86_64-apple-darwin"
            toolchain: "darwin"
            images: { a: "ubuntu-24.04", b: "ubuntu-24.04" }
            sdk: "apple"
            deployment_target: "13.3"
            options: "-Denable-avx2=ON -Denable-sse41=ON -Denable-aesni=ON"
            flags: "-march=x86-64-v3 -mtune=generic"

          - basename: "bs-macos-arm64"
            host: "arm64-apple-darwin"
            toolchain: "darwin"
            images: { a: "ubuntu-24.04", b: "ubuntu-24.04" }
            sdk: "apple"
            deployment_target: "13.3"
            options: "-Denable-sha3=ON -Denable-sha2=ON -Denable-aes=ON"
            flags: "-mtune=apple-m1"

          - basename: "bs-windows-x64"
            host: "x86_64-pc-windows-msvc"
            toolchain: "windows"
            images: { a: "ubuntu-24.04", b: "ubuntu-24.04" }
            sdk: "windows"
            options: "-Denable-avx2=ON -Denable-sse41=ON"

          - basename: "bs-windows-x64-shani"
            host: "x86_64-pc-windows-msvc"
            toolchain: "windows"
            images: { a: "ubuntu-24.04", b: "ubuntu-24.04" }
            sdk: "windows"
            options: "-Denable-shani=ON -Denable-avx2=ON -Denable-sse41=ON"

          - basename: "bs-windows-x64-avxifma"
            host: "x86_64-pc-windows-msvc"
            toolchain: "windows"
            images: { a: "ubuntu-24.04", b: "ubuntu-24.04" }
            sdk: "windows"
            options: "-Denable-avxifma=ON -Denable-shani=ON -Denable-avx2=ON -Denable-sse41=ON"

          - basename: "bs-windows-x64-avx512ifma"
            host: "x86_64-pc-windows-msvc"
            toolchain: "windows"
            images: { a: "ubuntu-24.04", b: "ubuntu-24.04" }
            sdk: "windows"
            options: "-Denable-avx512ifma=ON -Denable-shani=ON -Denable-avx2=ON -Denable-sse41=ON"

          - basename: "bs-windows-arm64"
            host: "aarch64-pc-windows-msvc"
            toolchain: "windows"
            images: { a: "ubuntu-24.04", b: "ubuntu-24.04" }
            sdk: "windows"

          - basename: "bs-windows-arm64-sha2"
            host: "aarch64-pc-windows-msvc"
            toolchain: "windows"
            images: { a: "ubuntu-24.04", b: "ubuntu-24.04" }
            sdk: "windows"
            options: "-Denable-sha2=ON -Denable-aes=ON"

          - basename: "bs-windows-arm64-sha3"
            host: "aarch64-pc-windows-msvc"
            toolchain: "windows"
            images: { a: "ubuntu-24.04", b: "ubuntu-24.04" }
            sdk: "windows"
            options: "-Denable-sha2=ON -Denable-sha3=ON -Denable-aes=ON"

          - basename: "selector-linux-x64"
            host: "x86_64-linux-gnu"
            toolchain: "x86_64-linux-gnu"
            images: { a: "ubuntu-24.04", b: "ubuntu-24.04-arm" }
            project: "libbitcoin-system"
            program: "selector"
            linkflags: "-static-libstdc++ -static-libgcc"

          - basename: "selector-linux-arm64"
            host: "aarch64-linux-gnu"
            toolchain: "aarch64-linux-gnu"
            images: { a: "ubuntu-24.04", b: "ubuntu-24.04-arm" }
            project: "libbitcoin-system"
            program: "selector"
            linkflags: "-static-libstdc++ -static-libgcc"

          - basename: "selector-macos-x64"
            host: "x86_64-apple-darwin"
            toolchain: "darwin"
            images: { a: "ubuntu-24.04", b: "ubuntu-24.04" }
            sdk: "apple"
            deployment_target: "13.3"
            project: "libbitcoin-system"
            program: "selector"

          - basename: "selector-macos-arm64"
            host: "arm64-apple-darwin"
            toolchain: "darwin"
            images: { a: "ubuntu-24.04", b: "ubuntu-24.04" }
            sdk: "apple"
            deployment_target: "13.3"
            project: "libbitcoin-system"
            program: "selector"

          - basename: "selector-windows-x64"
            host: "x86_64-pc-windows-msvc"
            toolchain: "windows"
            images: { a: "ubuntu-24.04", b: "ubuntu-24.04" }
            sdk: "windows"
            project: "libbitcoin-system"
            program: "selector"

          - basename: "selector-windows-arm64"
            host: "aarch64-pc-windows-msvc"
            toolchain: "windows"
            images: { a: "ubuntu-24.04", b: "ubuntu-24.04" }
            sdk: "windows"
            project: "libbitcoin-system"
            program: "selector"


    runs-on: ${{ matrix.target.images[matrix.builder] }}

    steps:
      - name: Checkout libbitcoin-server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: "src/libbitcoin-server"
          ref: ${{ needs.resolve.outputs.server }}
          repository: ${{ github.repository_owner }}/libbitcoin-server

      - name: Checkout libbitcoin-node
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: "src/libbitcoin-node"
          ref: ${{ needs.resolve.outputs.node }}
          repository: ${{ github.repository_owner }}/libbitcoin-node

      - name: Checkout libbitcoin-network
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: "src/libbitcoin-network"
          ref: ${{ needs.resolve.outputs.network }}
          repository: ${{ github.repository_owner }}/libbitcoin-network

      - name: Checkout libbitcoin-database
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: "src/libbitcoin-database"
          ref: ${{ needs.resolve.outputs.database }}
          repository: ${{ github.repository_owner }}/libbitcoin-database

      - name: Checkout libbitcoin-system
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: "src/libbitcoin-system"
          ref: ${{ needs.resolve.outputs.system }}
          repository: ${{ github.repository_owner }}/libbitcoin-system

      - name: Checkout build definition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: ".definition"
          ref: ${{ needs.resolve.outputs.server }}
          repository: ${{ github.repository_owner }}/libbitcoin-server
          sparse-checkout: |
            .github/actions
            .github/guix

      - name: Restore toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: guix-cache
          key: guix-${{ runner.arch }}-${{ matrix.target.toolchain }}-${{ hashFiles('.definition/.github/guix/*.scm', '.definition/.github/guix/patches/*') }}
          fail-on-cache-miss: true

      - name: Setup Guix
        uses: ./.definition/.github/actions/setup-guix
        with:
          cache: guix-cache

      - name: Download SDK
        if: ${{ matrix.target.sdk }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-${{ matrix.target.sdk }}
          path: sdk-archive

      - name: Unpack SDK
        if: ${{ matrix.target.sdk }}
        shell: bash
        run: |
          mkdir sdk
          zstd -dc sdk-archive/sdk.tar.zst | tar -x -C sdk
          echo "SDK=$(realpath "sdk/$(ls sdk)")" >> "$GITHUB_ENV"
          cat sdk-archive/sdk.txt

      - name: Build
        shell: bash
        env:
          HOST: ${{ matrix.target.host }}
          BASENAME: ${{ matrix.target.basename }}
          PROJECT: ${{ matrix.target.project }}
          PROGRAM: ${{ matrix.target.program }}
          FLAGS: ${{ matrix.target.flags }}
          LINKFLAGS: ${{ matrix.target.linkflags }}
          OPTIONS: ${{ matrix.target.options }}
          DEPLOYMENT_TARGET: ${{ matrix.target.deployment_target }}
        run: |
          bash .definition/.github/guix/guix-build.sh src build
          mkdir candidate symbols
          cp "build/$(awk 'NR == 1 { print $2 }' build/SHA256SUMS)" candidate/
          cp "build/$(awk 'NR == 2 { print $2 }' build/SHA256SUMS)" symbols/

      - name: Display binary information
        if: ${{ (runner.arch == 'X64' && matrix.target.host == 'x86_64-linux-gnu') || (runner.arch == 'ARM64' && matrix.target.host == 'aarch64-linux-gnu') }}
        continue-on-error: true
        shell: bash
        working-directory: candidate
        run: |
          ./${{ matrix.target.basename }} --version
          ./${{ matrix.target.basename }} --hardware

      - name: Display linkage
        shell: bash
        working-directory: candidate
        run: |
          file *
          if [[ "${{ matrix.target.host }}" == *-linux-gnu ]]; then
            readelf -d * | grep -E 'NEEDED|RPATH|RUNPATH|SONAME' || echo "(none)"
            readelf -V --wide * | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
          fi

      - name: Record build
        shell: bash
        run: |
          mkdir output
          cp candidate/* symbols/* output/
          {
            echo "image: ${ImageOS} ${ImageVersion} ${RUNNER_ARCH}"
            echo "guix: $(grep -o 'commit "[0-9a-f]*"' .definition/.github/guix/channels.scm)"
            echo "host: ${{ matrix.target.host }}"
            if [[ -f sdk-archive/sdk.txt ]]; then cat sdk-archive/sdk.txt; fi
          } | tee output/toolchain.txt
          cd output
          FILES=$(ls | grep -v -x toolchain.txt)
          sha256sum ${FILES} | tee SHA256SUMS

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: double-${{ matrix.target.basename }}-${{ matrix.builder }}
          path: output
          retention-days: 7

      - name: Upload artifacts
        if: ${{ matrix.builder == 'a' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target.basename }}
          path: candidate/*
          retention-days: 1
          if-no-files-found: error

      - name: Upload symbols
        if: ${{ matrix.builder == 'a' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: symbols-${{ matrix.target.basename }}
          path: symbols/*
          retention-days: 1
          if-no-files-found: error

  compare:
    needs: [ guix ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04

    steps:
      - name: Download builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: double-*

      - name: Compare hashes
        id: compare
        shell: bash
        run: |
          echo "| file | builder a | builder b |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          DIFFER=""
          MISSING=""
          for NAME in bs-linux-x64 bs-linux-x64-shani bs-linux-x64-avxifma bs-linux-x64-avx512ifma bs-linux-arm64 bs-linux-arm64-sha2 bs-linux-arm64-sha3 bs-macos-x64 bs-macos-arm64 bs-windows-x64 bs-windows-x64-shani bs-windows-x64-avxifma bs-windows-x64-avx512ifma bs-windows-arm64 bs-windows-arm64-sha2 bs-windows-arm64-sha3 selector-linux-x64 selector-linux-arm64 selector-macos-x64 selector-macos-arm64 selector-windows-x64 selector-windows-arm64; do
            A="double-${NAME}-a"
            B="double-${NAME}-b"
            if [[ ! -f "${A}/SHA256SUMS" || ! -f "${B}/SHA256SUMS" ]]; then
              MISSING="${MISSING} ${NAME}"
              continue
            fi
            join -j 2 <(sort -k2 "${A}/SHA256SUMS") <(sort -k2 "${B}/SHA256SUMS") |
              awk '{ print "| " $1 " | " substr($2, 1, 16) " | " substr($3, 1, 16) " |" }' >> "$GITHUB_STEP_SUMMARY"
            if ! cmp -s "${A}/SHA256SUMS" "${B}/SHA256SUMS"; then
              DIFFER="${DIFFER} double-${NAME}"
            fi
          done
          if [[ -n "${MISSING}" ]]; then
            echo "Builds missing:${MISSING}" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "missing=${MISSING}" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "${DIFFER}" ]]; then
            echo "Builds differ:${DIFFER}" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "differ=${DIFFER}" >> "$GITHUB_OUTPUT"
          elif [[ -z "${MISSING}" ]]; then
            echo "Builds are identical." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Explain differences
        if: ${{ steps.compare.outputs.differ != '' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends diffoscope-minimal binutils
          mkdir report
          for PAIR in ${{ steps.compare.outputs.differ }}; do
            for FILE in $(cut -d' ' -f3 "${PAIR}-a/SHA256SUMS"); do
              diffoscope --max-report-size 50000000 \
                --text "report/${FILE}.txt" --html "report/${FILE}.html" \
                "${PAIR}-a/${FILE}" "${PAIR}-b/${FILE}" || true
            done
          done
          head -c 20000 report/*.txt

      - name: Upload report
        if: ${{ steps.compare.outputs.differ != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diffoscope
          path: report
          retention-days: 7

      - name: Fail on difference
        if: ${{ steps.compare.outputs.differ != '' || steps.compare.outputs.missing != '' }}
        shell: bash
        run: exit 1
