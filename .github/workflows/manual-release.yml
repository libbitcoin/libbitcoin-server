            image: ubuntu-24.04
            container: alpine:3.22.6
            flags: "-march=x86-64-v3 -mtune=generic"

          - basename: "bs-musl-x64-avxifma"
            configuration: release
            link: static
            toolchain: cmake
            options: "-Denable-avxifma=ON -Denable-shani=ON  -Denable-avx2=ON -Denable-sse41=ON"
            cc: "gcc"
